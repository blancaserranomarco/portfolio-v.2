            [['Where','Dónde'],['Inside the app','Dentro de la app'],['Outside the app, by email','Fuera de la app, por email']],
            [['When','Cuándo'],['Right after seeing the result','Justo tras ver el resultado'],['4 days after the result','4 días después del resultado']],
            [['What','Qué'],['Modal with the discount and a button to checkout','Modal con el descuento y botón al checkout'],['Email that took them back to the modal','Email que llevaba de vuelta a la modal']],
            [['Result','Resultado'],['Purchases went up','Subieron las compras'],['Barely opened. CRM and Marketing were already sending plenty of follow-ups; we closed it.','Apenas se abrió. CRM y Marketing ya enviaban muchos seguimientos; lo cerramos.'],1]],
      cap:['The reminder has to reach users where they already are: inside the flow, not in one more email.','El recordatorio tiene que llegar donde ya está el usuario: dentro del flujo, no en un email más.']},
    {k:'h', t:['Which brand should lead the message?','¿Qué marca debía protagonizar el mensaje?']},
    {k:'p', t:['One question remained: which brand should go first, the partner’s or ours? My hypothesis was that another brand in the middle of a payment could feel like an ad and be perceived as something negative. Keeping TaxDown as the lead, with the partner as backing, could give the experience continuity.',
               'Quedaba una duda: ¿qué marca debía ir primero, la del partner o la nuestra? Mi hipótesis era que otra marca en mitad de un pago podía parecer publicidad y percibirse como algo negativo. Pero mantener a TaxDown como protagonista, con el partner como respaldo, podía darle continuidad a la experiencia.']},
    {k:'p', t:['So, within experiment 2, we also compared two versions of the modal inside the flow, with around 5,000 users from 3 top partners: a control with no modal, one version led by the partner and one led by TaxDown.',
               'Así que, dentro del experimento 2, también comparamos dos versiones de la modal en el flujo, con unos 5.000 usuarios de 3 partners top: un control sin modal, una versión liderada por el partner y otra por TaxDown.']},
    {k:'quiz', q:['Which one do you think sold more?','¿Cuál crees que vendió más?'], sub:['Same discount, same moment. Only the brand that goes first changes.','Mismo descuento, mismo momento. Solo cambia qué marca va primero.'],
      opts:[{id:'a',img:'assets/taxdown-modal-partner.webp',t:['Modal led by the partner: the bank the user knows, front and centre.','Modal liderada por el partner: el banco que el usuario conoce, en grande.']},
            {id:'b',img:'assets/taxdown-modal-taxdown.webp',t:['Modal led by TaxDown: our brand first, the partner as backing.','Modal liderada por TaxDown: nuestra marca primero, el partner como respaldo.']}],
      win:'b', rows:[[['No modal','Sin modal'],14.5],[['Partner brand','Marca partner'],17],[['TaxDown brand','Marca TaxDown'],21.5,'mint']], unit:'%',
      ok:['Well spotted. TaxDown’s brand won by 4.5 points: inside a payment, our brand reads as part of the flow, not as an ad.','Bien visto. Ganó la marca TaxDown por 4,5 puntos: dentro de un pago, nuestra marca se lee como parte del flujo y no como publicidad.'],
      ko:['It seems logical, but TaxDown’s brand won by 4.5 points: another brand in the middle of a payment reads as an ad.','Parece lo lógico, pero ganó la marca TaxDown por 4,5 puntos: otra marca en mitad de un pago se lee como publicidad.'],
      note:['19–30 June 2026 · Experiment 2, A/B/C · ~5,000 users from 3 top partners · Purchase after seeing the result, statistically significant · BBVA shown as the example','19–30 de junio de 2026 · Experimento 2, A/B/C · ~5.000 usuarios de 3 partners top · Compra tras ver el resultado, estadísticamente significativo · BBVA como ejemplo']},

    {k:'chap', n:['5 · What changed','5 · Lo que cambió'], t:['The moment mattered more than the message','El momento pesaba más que el mensaje']},
    {k:'p', t:['The season ended before we could roll it out, so the plan was to launch the TaxDown-brand modal in the next one and stop adapting each modal to each partner: a single piece, cheaper to maintain and converting more.',
               'La campaña acabó antes de poder desplegarlo, así que el plan era lanzar la modal con marca TaxDown en la siguiente y dejar de adaptar cada modal a cada partner: una sola pieza, más barata de mantener y que convertía más.']},
    {k:'next', h:['Next steps','Siguientes pasos'], t:[['Launch the TaxDown modal in the next season and test the impact of showing the discount as a percentage versus a final price with the original one struck through.','Lanzar la modal de TaxDown en la siguiente campaña y probar el impacto entre presentar el % de descuento o una cifra final con el precio tachado.'],
                 ['Reuse the onboarding as the base for one piece at each moment of the journey, to keep experimenting with other options before and after the season.','Reutilizar el onboarding como base para una pieza en cada momento del journey, para continuar experimentando con otras opciones antes y después de la campaña.'],
                 ['Fix the bug the interviews surfaced: a referral code overrode the partner discount.','Arreglar el bug que salió en las entrevistas: un código referral pisaba el descuento del partner.']]},
    {k:'impact', from:[['Product','Producto'],'+7 pp',['purchase after the result (+48% relative)','compra tras el resultado (+48% relativo)']],
      to:[['Business (estimate)','Negocio (estimación)'],['≈ €24K','≈ 24.000 €'],['more per 10K partner users who reach their result','más por cada 10K usuarios de partners que llegan al resultado']], more:'impact'}
  ],
  ask:[
    {id:'impact', q:['What was the business impact?','¿Qué impacto tuvo en negocio?'], m:[['14.5% → 21.5%',['purchase after seeing the result, significant','compra tras ver el resultado, significativo']],['+5.3 pp',['connection with the tax agency, with the onboarding','conexión con la AEAT con el onboarding']],['~40%',['of revenue came through partners','de la facturación llegaba por partners']],[['≈ €24K','≈ 24.000 €'],['estimated per 10,000 partner users who reach their result','estimado por cada 10.000 usuarios de partners que llegan al resultado']]], note:['Estimated figure, to be validated in the next season. How it’s calculated: +7 pp means 700 more plans per 10,000 users who see their result. Each plan is ~€34: the recommended LIVE plan, worth €45, with the 25% average partner discount (it ranges from 20% to 30%).','Cifra estimada, pendiente de validar en la siguiente campaña. Cómo se calcula: +7 pp son 700 planes más por cada 10.000 usuarios que ven su resultado. Cada plan son ~34 €: el plan LIVE recomendado, por valor de 45 €, con el 25 % de descuento medio de los partners (va del 20 % al 30 %).']},
    {id:'role', q:['What was my role?','¿Cuál fue mi papel?'], list:[['I proposed testing inside the product instead of repeating the landing.','Propuse probar dentro del producto en lugar de repetir la landing.'],['I designed the onboarding and the modals, and defined the brand hypothesis for the A/B/C.','Diseñé el onboarding y las modales, y definí la hipótesis de marca del A/B/C.'],['I validated the onboarding with users and internal teams before launch, because the authorisation is sensitive.','Validé el onboarding con usuarios y equipos internos antes de lanzarlo, porque el apoderamiento es sensible.'],['I worked with the PM and 2 engineers, one focused on this experiment.','Trabajé con el PM y 2 ingenieros, uno con foco en este experimento.']]},
    {id:'discarded', q:['What did I rule out?','¿Qué descarté?'], dec:[
      [['Longer landing','Landing más larga'],'no',['An earlier experiment had shown that the short, no-scroll version converted better.','Un experimento anterior ya demostraba que la versión corta, sin scroll, convertía mejor.']],
      [['Skippable onboarding','Onboarding que se puede saltar'],'no',['The authorisation was required to continue: skipping it only delayed it.','El apoderamiento era necesario para continuar: saltarlo solo lo retrasaba.']],
      [['Showing the discount more often in the flow','Mostrar el descuento más veces en el flujo'],'no',['It already appeared under the result and in checkout. The problem was the moment, not how often we showed it.','Ya aparecía bajo el resultado y en el checkout. El problema era el momento, no cuántas veces lo enseñábamos.']],
      [['Email to those who left (2B)','Email a quienes se marcharon (2B)'],'no',['We tested it in parallel, but it was barely opened: CRM and Marketing were already sending plenty of follow-ups.','Lo probamos en paralelo, pero apenas se abría: CRM y Marketing ya enviaban muchos seguimientos.']],
      [['Modal led by the partner','Modal liderada por el partner'],'no',['We tested it against the TaxDown one and it converted less (17% vs 21.5%): in the middle of a payment, another brand feels like an ad.','La probamos frente a la de TaxDown y convirtió menos (17 % frente a 21,5 %): en mitad de un pago, otra marca parece publicidad.']],
      [['A different modal for each partner','Una modal distinta para cada partner'],'no',['It multiplied design and maintenance work, and a single TaxDown-led piece converted more.','Multiplicaba el diseño y el mantenimiento, y una sola pieza liderada por TaxDown convertía más.']],
      [['Strikethrough price this season','Precio tachado en esta campaña'],'no',['It depended on each user’s plan and discount: too big a change mid-season. It stays as a next step.','Dependía del plan y del descuento de cada usuario: demasiado cambio en plena campaña. Queda como siguiente paso.']]]},
    {id:'wrong', q:['What went wrong?','¿Qué salió mal?'], list:[['The first experiment solved a friction that wasn’t the one holding back the purchase: we spent two weeks of the season on an incomplete hypothesis.','El primer experimento resolvió una fricción que no era la que frenaba la compra: dedicamos dos semanas de campaña a una hipótesis incompleta.'],['The season ended before we could roll out the winning modal.','La campaña acabó antes de desplegar la modal ganadora.'],['The interviews surfaced a bug: a referral code overrode the partner discount.','Las entrevistas destaparon un bug: un código referral pisaba el descuento del partner.']]},
    {id:'learned', q:['What did I learn?','¿Qué aprendí?'], learn:[
      [['Chain your experiments','Encadenar experimentos'],['Not every experiment comes out positive. What matters is checking whether the hypothesis and the solution held up, and making quick decisions based on the data each experiment gives you. That’s why it pays not to invest too much time in each one, so you can stay agile, and once you find the answer, give it the time it needs.','No todos los experimentos salen positivos. Lo interesante es revisar si la hipótesis y la solución se sostenían, y tomar decisiones rápidas con los datos que da cada experimento. Por eso compensa no invertir mucho tiempo en cada uno, para ser ágiles, y cuando das con la respuesta, dedicarle el tiempo necesario.']],
      [['Numbers say what, users say why','Los números dicen qué, los usuarios por qué'],['The survey turned a partial result into the hypothesis that worked.','La encuesta convirtió un resultado parcial en la hipótesis que funcionó.']],
      [['Timing beats volume','El momento gana al volumen'],['We didn’t need to show the discount more, just at the right moment.','No hacía falta enseñar más el descuento, solo en el momento justo.']]]},
    {id:'different', q:['What would I do differently today?','¿Qué haría distinto hoy?'], learn:[
      [['Start experimenting earlier','Empezar a experimentar antes'],['I joined a couple of months before the season, without all the context I needed to decide with confidence. Next season I would launch the first experiments earlier, so I reach it with hypotheses already tested. And that leads me to a second confirmation.','Entré un par de meses antes de la campaña, sin todo el contexto que necesitaba para decidir con seguridad. La próxima campaña lanzaría los primeros experimentos antes, para llegar a ella con hipótesis ya probadas. Y eso me lleva a una segunda confirmación.']],
      [['Don’t let speed take over the documentation','No dejar que la velocidad se coma la documentación'],['It confirmed how important it is not to get carried away by the pace of the season and to look after the documentation: each experiment, its data and the decision we took, so that I or anyone else can come back to it when they need to decide.','Me confirmó la importancia de no dejarme llevar por la velocidad de la campaña y cuidar la documentación: cada experimento, sus datos y la decisión que tomamos, para que yo u otras personas podamos volver a esa información cuando haga falta decidir.']]]},
    {id:'inspired', q:['What inspired me?','¿En qué me inspiré?'], learn:[
      [['The onboarding','El onboarding'],['We looked at all the apps that use the onboarding to give context and even personalise the experience. We planned to use that personalisation idea in the next phases of the onboarding, to experiment with it.','Nos fijamos en todas las aplicaciones que aprovechan el onboarding para dar contexto e incluso personalizar la experiencia. Esa idea de personalización la queríamos aprovechar en las siguientes fases del onboarding para experimentar con ella.']],
      [['The modal','La modal'],['For the branding, we looked at banking apps: they always keep their own brand above the partner’s. There was a strong belief in the company, based on earlier research, that for us it should be the other way round. We challenged it at this key point of the experiment: inside a sensitive flow like a payment, another brand could feel like spam. Leading with our brand also made it easier to scale, because the base is our colours and font, not the partner’s.','Para el branding nos inspiramos en las aplicaciones bancarias: siempre mantienen su propio sello por encima del del partner. En la empresa había una idea muy fuerte, por investigaciones anteriores, de que con nosotros debía ser al revés. La cuestionamos en este punto clave del experimento: dentro de un flujo sensible como un pago, otra marca podía sentirse como spam. Liderar con nuestra marca también facilitaba escalar, porque la base son nuestros colores y nuestra fuente, no los del partner.']]]}
  ],

(function(){

  const close=()=>{ if(!lb) return; lb.remove(); lb=null; back&&back.focus(); };
  const open=img=>{ back=img; lb=document.createElement('div'); lb.className='zoom'; lb.setAttribute('role','dialog'); lb.setAttribute('aria-modal','true'); lb.setAttribute('aria-label',img.alt);
    lb.innerHTML=`<button type="button" class="zoom-x" aria-label="${esc(u('close_img'))}">×</button><div class="zoom-in"><img src="${img.getAttribute('src')}" alt="${esc(img.alt)}"></div>`;
    document.body.appendChild(lb); lb.querySelector('.zoom-x').focus(); };
  document.addEventListener('click',e=>{ const im=e.target.closest('img[data-zoom]'); if(im){ e.preventDefault(); open(im); return; }
    if(lb && (e.target===lb || e.target.closest('.zoom-x') || e.target.classList.contains('zoom-in'))) close(); });
  document.addEventListener('keydown',e=>{ if(lb && e.key==='Escape'){ e.stopPropagation(); close(); return; }
    const im=e.target.closest && e.target.closest('img[data-zoom]'); if(im && (e.key==='Enter'||e.key===' ')){ e.preventDefault(); open(im); } },true);

async function sendFb(rec){
  // 1) the deployed site: serverless endpoint that writes to Notion and emails Blanca
  try{ const r=await fetch('/api/feedback',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(rec)}); if(r.ok) return true; }catch(e){}

  try{ const db=window.claude&&await window.claude.use('db'); const us=db&&await window.claude.use('user'); const id=us&&await us.id(); if(db&&id){ await db.collection('feedback/'+id+'/items').add(rec); return true; } }catch(e){}
  return false; }

  $('#live').textContent = S.focus && S.focus!=='all' ? `${u('sel_h')}: ${selIds().map(id=>tr(byId(id).short)).join(', ')}` : ''; }
function setFocus(k){
  S.focus = k; S.touched=true;
  if(S.wtab==='co'){ setWTab('proj'); document.querySelectorAll('[data-focus]').forEach(b=> b.setAttribute('aria-pressed', b.dataset.focus===S.focus)); $('#selected').scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'}); return; }
  $('.cta-hand')?.remove();

    $('#app > .wrap').insertAdjacentHTML('afterend', selectedHTML());
    document.querySelectorAll('[data-focus]').forEach(b=> b.setAttribute('aria-pressed', b.dataset.focus===S.focus));
    const sec=$('#selected'); if(!reduce) sec.animate([{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'none'}],{duration:450,easing:'cubic-bezier(.2,.8,.2,1)'});
    markList(); sec.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'}); return; }
  document.querySelectorAll('[data-focus]').forEach(b=> b.setAttribute('aria-pressed', b.dataset.focus===S.focus));
  // selected work with FLIP
  const grid=$('#sgrid'); const first={};
  grid.querySelectorAll('.scard').forEach(el=> first[el.dataset.key]=el.getBoundingClientRect());
  grid.innerHTML = selIds().map(id=>scard(byId(id))).join('');
  grid.className=`sgrid n${selIds().length}`;
  $('#sel-sub').textContent = tr(FOCUS[S.focus].sub);
  if(!reduce) grid.querySelectorAll('.scard').forEach((el,i)=>{ const f=first[el.dataset.key], n=el.getBoundingClientRect();

    else el.animate([{opacity:0,transform:'translateY(14px) rotate(-1deg)'},{opacity:1,transform:'none'}],{duration:420,delay:i*60,easing:'cubic-bezier(.2,.8,.2,1)',fill:'backwards'}); });
  markList();
  $('#live').textContent = `${u('sel_h')}: ${selIds().map(id=>tr(byId(id).short)).join(', ')}`;

/* ---------- Cursor sparkle trail (subtle) ---------- */
(function sparkleTrail(){
  if(reduce || !matchMedia('(hover:hover) and (pointer:fine)').matches) return;
  const layer=document.createElement('div'); layer.className='trail'; layer.setAttribute('aria-hidden','true'); document.body.append(layer);
  const tones=['--butter','--lilac','--mint','--pink','--sky'];
  let lx=0, ly=0, last=0, alive=0, n=0;
  addEventListener('pointermove', e=>{
    const now=performance.now(), dx=e.clientX-lx, dy=e.clientY-ly;
    if(now-last<55 || dx*dx+dy*dy<420 || alive>14) return;
    last=now; lx=e.clientX; ly=e.clientY; alive++; n++;
    const s=7+Math.random()*7, el=document.createElement('span');
    el.className='tr-s';
    el.innerHTML=`<svg viewBox="0 0 24 24" width="${s}" height="${s}"><path d="M12 1.5l2.3 7.2 7.2 2.3-7.2 2.3L12 20.5l-2.3-7.2L2.5 11l7.2-2.3z" style="fill:var(${tones[n%tones.length]})"/></svg>`;
    el.style.left=(e.clientX+6)+'px'; el.style.top=(e.clientY+6)+'px';
    layer.append(el);
    const drift=(Math.random()-.5)*26, fall=14+Math.random()*16, rot=(Math.random()-.5)*160;
    el.animate([{transform:'translate(-50%,-50%) scale(.4) rotate(0deg)',opacity:0},{transform:'translate(-50%,-50%) scale(1) rotate(20deg)',opacity:.9,offset:.18},{transform:`translate(calc(-50% + ${drift}px),calc(-50% + ${fall}px)) scale(.3) rotate(${rot}deg)`,opacity:0}],
      {duration:760+Math.random()*260,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>{el.remove(); alive--;};
  },{passive:true});
})();

   y:['To judge a solution, you need to know the challenge. So I share what I prioritised, what I ruled out and how I balanced people’s needs with business goals. I want you to follow the reasoning and understand my contribution.','Para valorar una solución, necesitas conocer el reto. Por eso cuento qué prioricé, qué descarté y cómo equilibré las necesidades de las personas con los objetivos del negocio. Quiero que puedas seguir el razonamiento y entender mi aportación.']},
  {il:'hand',tone:'var(--peach)',tag:['Visual design','Diseño visual'],h:['My identity, in the details','Mi identidad, en los detalles'],
   w:['A retro-flavoured look in a modern digital experience.','Una estética con aire retro en una experiencia digital actual.'],
   y:['I chose a visual language that mixes nostalgia and play. A nod to those new interfaces that still borrowed visual references from the physical world, and where the rules were still to be written.','Elegí un lenguaje visual que mezcla nostalgia y juego. Un guiño a aquellas nuevas interfaces que aún tomaban referencias visuales del mundo físico y donde las reglas estaban todavía por escribir.'],
   d:['Aesthetic-usability effect: we perceive attractive designs as easier to use.','Efecto estética-usabilidad: percibimos los diseños atractivos como más fáciles de usar.'],
   s:[['Kurosu & Kashimura, Hitachi, 1995','Kurosu y Kashimura, Hitachi, 1995'],'https://lawsofux.com/aesthetic-usability-effect/']},
  {il:'fb',tone:'var(--mint)',tag:['Listening and iteration','Escucha e iteración'],h:['How was the experience?','¿Qué tal ha sido la experiencia?'],

   y:['Designing also means putting your own ideas to the test. This satisfaction question lets me gather your impression and make room for criticism. Listening, questioning my decisions and learning from feedback are part of my work as a product designer.','Diseñar también es poner a prueba tus propias ideas. Esta pregunta de satisfacción me permite recoger tu impresión y abrir espacio a la crítica. Escuchar, cuestionar mis decisiones y aprender del feedback son parte de mi trabajo como diseñadora de producto.']}
];

let i=0, deck=null, stack=null, dots=null, live=null, opener=null;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const CARDS=DECK;
function ensure(){
  if(!deck){
    document.body.insertAdjacentHTML('beforeend',`<div class="deck" id="deck" role="dialog" aria-modal="true" aria-labelledby="deck-t">
  <div class="deck-in">
    <div class="deck-top"><span class="t" id="deck-t"></span><button class="x" id="dk-close">×</button></div>
    <div class="stack" id="dk-stack"></div>
    <p class="swipe-tip" id="dk-tip"></p>
    <div class="sr" id="dk-live" aria-live="polite"></div>
  </div></div>`);
    deck=document.getElementById('deck'); stack=document.getElementById('dk-stack'); live=document.getElementById('dk-live');
    document.getElementById('dk-close').onclick=close;
    deck.addEventListener('click',e=>{ if(e.target===deck) close(); });
    stack.addEventListener('click',e=>{
      const a=e.target.closest('[data-a]'); if(!a) return;
      if(a.dataset.a==='next') go(1); else if(a.dataset.a==='prev') go(-1); else if(a.dataset.a==='close') close();
    });
  }
  document.getElementById('deck-t').textContent=dk('title');
  document.getElementById('dk-close').setAttribute('aria-label',dk('close'));
  document.getElementById('dk-tip').textContent=dk('tip');
}
function cardHTML(c,k){
  return `<div class="c-bd"><div class="c-meta"><span class="c-n">${k+1}/${CARDS.length}</span><span class="c-tag" style="--tone:${c.tone}">${tr(c.tag)}</span></div><div class="c-top"><h2>${tr(c.h)}</h2><div class="c-il il il-${c.il}" style="--tone:${c.tone}" aria-hidden="true">${IL[c.il]}</div></div><p class="what">${tr(c.w)}</p>
  ${c.y?`<div class="why"><span class="k">${c.k?tr(c.k):dk('why')}</span><p>${tr(c.y)}</p></div>`:''}
  ${c.d?`<div class="dato"><span class="k">${dk('data')}</span><p>${tr(c.d)}</p>${c.s?`<a href="${c.s[1]}" target="_blank" rel="noopener">${tr(c.s[0])} ↗</a>`:''}</div>`:''}
  </div>
  <div class="c-ft"><button type="button" class="btn alt" data-a="prev" aria-label="${dk('prev')}"${k===0?' disabled':''}>←</button><span class="dots" aria-hidden="true">${CARDS.map((_,j)=>`<i class="${j===k?'on':''}"></i>`).join('')}</span>${k===CARDS.length-1?`<button type="button" class="btn" data-a="close">${dk('close')}</button>`:`<button type="button" class="btn" data-a="next">${dk('cont')} →</button>`}</div>`;
}
function render(){
  stack.innerHTML='';
  [2,1,0].forEach(off=>{
    const k=i+off; if(k>=CARDS.length) return;
    const el=document.createElement('article');
    el.className='card '+(off===0?'front':off===1?'back1':'back2');
    el.setAttribute('aria-roledescription',dk('card'));
    if(off){ el.setAttribute('aria-hidden','true'); el.inert=true; }
    el.innerHTML=cardHTML(CARDS[k],k);
    stack.appendChild(el);
  });
  live.textContent=dk('of').replace('{a}',i+1).replace('{b}',CARDS.length)+': '+tr(CARDS[i].h);
  bindDrag(stack.querySelector('.front'));
  if(deck.classList.contains('on')){ const f=stack.querySelector('.front .c-ft [data-a="next"],.front .c-ft [data-a="close"]'); f&&f.focus({preventScroll:true}); }
}
function go(dir){
  const n=i+dir; if(n<0||n>=CARDS.length) return;
  const f=stack.querySelector('.front');
  if(dir>0 && f && !reduce){ f.classList.add('fly'); f.style.transform='translate(110%,-20px) rotate(18deg)'; f.style.opacity='0'; setTimeout(()=>{i=n;render();},300); }
  else { i=n; render(); }
}
function bindDrag(el){
  if(!el) return;
  let x0=null,y0=0,dx=0,lock=null;
  const start=(x,y)=>{x0=x;y0=y;dx=0;lock=null;};
  const move=(x,y,e)=>{
    if(x0===null) return;
    const ddx=x-x0, ddy=y-y0;
    if(!lock){ if(Math.abs(ddx)<6&&Math.abs(ddy)<6) return; lock=Math.abs(ddx)>Math.abs(ddy)?'x':'y'; if(lock==='x') el.classList.add('drag'); }
    if(lock!=='x') return;
    if(e&&e.cancelable) e.preventDefault();
    dx=ddx; el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
  };
  const end=()=>{
    if(x0===null) return; x0=null; el.classList.remove('drag');
    if(lock!=='x') return;
    if(Math.abs(dx)>80 && i<CARDS.length-1){
      el.classList.add('fly'); el.style.transform=`translate(${Math.sign(dx)*120}%,-20px) rotate(${Math.sign(dx)*20}deg)`; el.style.opacity='0';
      setTimeout(()=>{i++;render();},reduce?0:300);
    } else { el.classList.add('settle'); el.style.transform=''; setTimeout(()=>el.classList.remove('settle'),260); }
  };
  // touch (phones/tablets): lock to the horizontal axis, vertical keeps scrolling the card text
  el.addEventListener('touchstart',e=>{ if(e.target.closest('button,a')) return; const t=e.touches[0]; start(t.clientX,t.clientY); },{passive:true});
  el.addEventListener('touchmove',e=>{ const t=e.touches[0]; move(t.clientX,t.clientY,e); },{passive:false});
  el.addEventListener('touchend',end); el.addEventListener('touchcancel',end);
  // mouse / pen
  el.addEventListener('pointerdown',e=>{ if(e.pointerType==='touch'||e.target.closest('button,a')) return; start(e.clientX,e.clientY); el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove',e=>{ if(e.pointerType!=='touch') move(e.clientX,e.clientY,e); });
  el.addEventListener('pointerup',e=>{ if(e.pointerType!=='touch') end(); });
  el.addEventListener('pointercancel',e=>{ if(e.pointerType!=='touch') end(); });
  // hover (desktop): the card leans toward the mouse to hint that it can be dragged
  if(!reduce && matchMedia('(hover:hover) and (pointer:fine)').matches){
    el.addEventListener('pointermove',e=>{ if(e.pointerType!=='mouse'||x0!==null) return; const r=el.getBoundingClientRect(); const k=Math.max(-1,Math.min(1,((e.clientX-r.left)/r.width-.5)*2)); el.classList.add('lean'); el.style.translate=`${k*12}px 0`; el.style.rotate=`${k*2}deg`; });
    el.addEventListener('pointerleave',()=>{ el.style.translate=''; el.style.rotate=''; });
    el.addEventListener('pointerdown',()=>{ el.style.translate=''; el.style.rotate=''; });
  }
}

function open(){ ensure(); i=0; render(); deck.classList.add('on'); document.body.style.overflow='hidden'; const f=stack.querySelector('.front [data-a="next"]'); f&&f.focus(); }
function close(){ deck.classList.remove('on'); document.body.style.overflow=''; opener&&opener.focus(); }
document.addEventListener('click',e=>{ const t=e.target.closest('[data-deck]'); if(!t) return; e.preventDefault(); opener=t; open(); });
document.addEventListener('keydown',e=>{
  if(!deck||!deck.classList.contains('on')) return;
  if(e.key==='Escape') close();
  if(e.key==='ArrowRight') go(1);
  if(e.key==='ArrowLeft') go(-1);
  if(e.key==='Tab'){
    const f=[...deck.querySelectorAll('button:not([disabled])')].filter(b=>b.offsetParent!==null && b.style.visibility!=='hidden' && !b.closest('[aria-hidden="true"]'));
    if(!f.length) return; const a=f[0], z=f[f.length-1];
    if(e.shiftKey && document.activeElement===a){ e.preventDefault(); z.focus(); }
    else if(!e.shiftKey && document.activeElement===z){ e.preventDefault(); a.focus(); }
  }
});
window.bsDeck={open:()=>open()};
})();

/* ---------- Language selector (footer) and mobile menu ---------- */
function setLang(l){ S.lang=l; store.set('lang',S.lang); const it=store.get('intro'); if(it){ it.lang=S.lang; store.set('intro',it); } render(); }
document.addEventListener('change',e=>{ if(e.target.id==='lang-sel'){ setLang(e.target.value); const s=$('#lang-sel'); s&&s.focus(); } });
(function(){
  const top=document.querySelector('.top'), btn=document.getElementById('menu-btn'), nav=document.getElementById('main-nav');
  if(!btn||!nav) return;
  const set=o=>{ top.classList.toggle('open',o); btn.setAttribute('aria-expanded',o); };
  btn.addEventListener('click',()=>set(!top.classList.contains('open')));
  nav.addEventListener('click',e=>{ if(e.target.closest('button')) set(false); });
  document.addEventListener('keydown',e=>{ if(e.key==='Escape'&&top.classList.contains('open')){ set(false); btn.focus(); } });
  document.addEventListener('click',e=>{ if(top.classList.contains('open')&&!e.target.closest('.top')) set(false); });
})();

/* ---------- Contact portrait: eyes follow the pointer, poke = scared, email copied = happy ---------- */
(function(){
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const face=()=>document.querySelector('.me-svg');
  let tmr=null;
  const mood=(m,ms)=>{ const s=face(); if(!s) return; clearTimeout(tmr); s.classList.remove('is-scared','is-happy'); void s.getBoundingClientRect(); if(m){ s.classList.add('is-'+m); tmr=setTimeout(()=>s.classList.remove('is-'+m),ms); } };
  if(!reduce) document.addEventListener('pointermove',e=>{ const s=face(); if(!s||s.offsetParent===null) return; const m=s.getScreenCTM(); if(!m) return;
    s.querySelectorAll('.me-eye').forEach(eye=>{ const ex=+eye.dataset.cx, ey=+eye.dataset.cy; const sx=m.a*ex+m.c*ey+m.e, sy=m.b*ex+m.d*ey+m.f; const dx=e.clientX-sx, dy=e.clientY-sy, L=Math.hypot(dx,dy)||1, k=Math.min(1,L/220);
      eye.style.transform=`translate(${(dx/L*3.4*k).toFixed(2)}px,${(dy/L*2.6*k).toFixed(2)}px)`; }); });
  if(!reduce) (function loop(){ setTimeout(()=>{ const s=face(); if(s&&!s.classList.contains('is-scared')&&!s.classList.contains('is-happy')){ s.querySelectorAll('.me-lid').forEach(l=>{ l.classList.remove('blink'); void l.getBoundingClientRect(); l.classList.add('blink'); }); } loop(); },2600+Math.random()*2800); })();
  document.addEventListener('click',e=>{ if(e.target.closest('[data-me="poke"]')) mood('scared',900); });
  document.addEventListener('bs:copied',()=>mood('happy',2200));
})();

</script>
