  lede:['Migrating the Discounts benefit to the new design system opened up a chance to improve the purchase experience too. Building on it, I drove three experiments with one developer to get more employees to complete their purchase.','La migración del beneficio de Descuentos al nuevo sistema de diseño abrió una oportunidad para mejorar también la experiencia de compra. A partir de ella, impulsé junto con un desarrollador tres experimentos para que más empleados completaran su compra.'],
  facts:[[['My role','Mi rol'],['Senior Product Designer\nB2B2C Benefits vertical','Senior Product Designer\nVertical de Beneficios B2B2C']],[['Period','Periodo'],['April – July 2024\n3 experiments in 4 months','Abril – julio de 2024\n3 experimentos en 4 meses']],[['Scope','Alcance'],['Employee app\nDetail, amount and payment','App del empleado\nDetalle, importe y pago']]],
  story:1,
  sum:[{k:['The challenge','El reto'], tone:'bad', t:['A benefit moving almost €1M a year, but used by fewer than 2% of eligible employees.','Un beneficio que movía casi 1M € al año, pero que usaba menos del 2 % de los empleados con acceso.']},
       {k:['My contribution','Mi aportación'], t:['I turned a required migration into three experiments, one per funnel step, with a single developer.','Convertí una migración obligatoria en tres experimentos, uno por paso del funnel, con un solo desarrollador.']},
       {k:['Impact','Impacto'], tone:'good', big:['19.4% → 32.2%','19,4% → 32,2%'], bigl:['From 19.4% to 32.2%','Del 19,4% al 32,2%'], t:['Completed purchases in experiment 3','Compras completadas en el experimento 3'], pp:['+12.8 pp','+12,8 pp']}],
  nums:[{v:'32.2%',t:['completed purchases, from 19.4%','compras completadas, desde 19,4%']},{v:'+€98.8K',t:['estimated extra GMV a year, conservative','GMV anual extra estimado, conservador']},{v:'3',t:['chained A/B experiments, 50/50, in Amplitude','experimentos A/B encadenados, 50/50, en Amplitude']}],
  blocks:[
    {k:'chap', n:['1 · The context','1 · El contexto'], t:['A profitable benefit almost no one used','Un beneficio rentable que casi nadie usaba']},
    {k:'p', t:['The Discounts benefit let employees buy brand coupons at a reduced price from the Cobee app. It was available in 846 companies and generated almost €1M a year in purchase volume (GMV), yet fewer than 2% of eligible employees used it.',
               'El beneficio de Descuentos permitía a los empleados comprar cupones de marcas a un precio reducido desde la app de Cobee. Estaba disponible en 846 empresas y generaba casi 1 M€ al año en volumen de compras (GMV), aunque lo utilizaba menos del 2 % de los empleados con acceso.']},
    {k:'p', t:['Low adoption repeated across companies of different sizes. There was room to grow, but we needed to understand what was stopping more employees from buying.',
               'La baja adopción se repetía en empresas de distintos tamaños. Había una oportunidad de crecimiento, pero necesitábamos entender qué impedía que más empleados compraran.']},
    {k:'p', t:['The migration to the new design system gave us a starting point: use the planned changes to test improvements in the flow and measure their effect on conversion.',
               'La migración al nuevo sistema de diseño nos daba un punto de partida: aprovechar los cambios previstos para probar mejoras en el flujo y medir su efecto en la conversión.']},
    {k:'goal', main:1, label:['Main goal','Objetivo principal'], t:['Increase purchase conversion in Discounts and, with it, the purchase volume generated.','Aumentar la conversión a compra en Descuentos y, con ello, el volumen de compras generado.']},
    {k:'h', t:['Understanding where and why people dropped off','Entender dónde y por qué abandonaban']},
    {k:'p', t:['We analysed the journey in Amplitude to find the losses between steps. In the sample analysed, of 553 people who saw the coupons, 167 completed a purchase: around 30%.',
               'Analizamos el recorrido en Amplitude para localizar las pérdidas entre pasos. En la muestra analizada, de 553 personas que vieron los cupones, 167 completaron una compra: alrededor del 30 %.']},
    {k:'p', t:['Session recordings and user feedback helped us interpret those losses. They pointed to three frictions: little clarity about how the benefit worked, doubts when entering the amount, and distrust when adding the card.',
               'Las grabaciones de sesión y el feedback de usuarios ayudaron a interpretar esas pérdidas. Apuntaban a tres fricciones: poca claridad sobre cómo funcionaba el beneficio, dudas al introducir el importe y desconfianza al añadir la tarjeta.']},
    {k:'trip', label:['The purchase journey before the experiments','El recorrido de compra antes de los experimentos'],
      steps:[[['Coupons','Cupones'],553],[['Detail','Detalle'],412],[['Amount','Importe'],308],[['Summary\nand payment','Resumen\ny pago'],242],[['Purchase\ndone','Compra\nhecha'],167]],
      bubbles:[{at:1,x:110,y:60,w:262,tone:'butter',tag:['On the detail','En el detalle'],q:['“How does this work?”','«¿Cómo funciona esto?»'],h:['Little clarity about the benefit','Poca claridad sobre el beneficio'],long:['On the detail: little clarity about how the benefit worked.','En el detalle: poca claridad sobre cómo funcionaba el beneficio.']},
               {at:2,x:400,y:138,w:320,tone:'pink',tag:['On the amount','En el importe'],q:['“Do I type what I pay or what I get?”','«¿Pongo lo que pago o lo que recibo?»'],h:['Doubts when entering the amount','Dudas al introducir el importe'],long:['On the amount: doubts when entering the amount.','En el importe: dudas al introducir el importe.']},
               {at:3,x:600,y:246,w:290,tone:'lilac',tag:['At payment','En el pago'],q:['“Is it safe to enter my card?”','«¿Es seguro meter mi tarjeta?»'],h:['Distrust when adding the card','Desconfianza al añadir la tarjeta'],long:['At payment: distrust when adding the card.','En el pago: desconfianza al añadir la tarjeta.']}],
      flow:[['assets/discount-t2-before.webp',['Coupons screen','Pantalla de cupones']],['assets/discount-t1-before-framed.webp',['Discount detail screen','Pantalla de detalle del descuento']],['assets/discount-t3-amount-before.webp',['Amount screen','Pantalla de importe']],['assets/discount-t3-pay-before.webp',['Summary and payment screen','Pantalla de resumen y pago']],null],
      done:{img:'assets/discount-t3-pay-before.webp',h:['Purchase done!','¡Compra hecha!'],t:['Your coupon is ready in Benefits.','Tu cupón ya está en Beneficios.'],btn:['OK','Aceptar'],alt:['Illustration: success message after completing the purchase','Ilustración: mensaje de éxito al completar la compra']},
      sr:['Of 553 people who saw the coupons, 75% opened a discount’s detail, 56% reached the amount, 44% reached the summary and payment and 30% completed the purchase. Frictions: little clarity about how the benefit worked, doubts at the amount step, and little sense of security when entering the card.','De 553 personas que vieron los cupones, el 75 % abrió el detalle de un descuento, el 56 % llegó al importe, el 44 % al resumen y pago y el 30 % completó la compra. Fricciones: poca claridad sobre cómo funcionaba el beneficio, dudas en el importe y poca seguridad al meter la tarjeta.'],
      cap:['Data from Amplitude.','Datos de Amplitude.']},
    {k:'p', t:['With these signals, I proposed splitting the migration into three A/B experiments with a 50/50 split, each focused on a different point of the journey.',
               'Con estas señales, propuse dividir la migración en tres experimentos A/B con reparto 50/50, centrados en distintos puntos del recorrido.']},
    {k:'p', t:['Together with a developer, I designed and tested the changes gradually. We measured their effect in Amplitude and used each result to decide what to keep and what to tackle next.',
               'Junto con un desarrollador, diseñé y probé los cambios de forma gradual. Medimos su efecto en Amplitude y utilizamos cada resultado para decidir qué mantener y qué abordar después.']},

    {k:'chap', n:['2 · Experiment 1','2 · Experimento 1'], t:['More people came in, but no more bought','Más gente entraba, pero no compraba más']},
    {k:'p', t:['Our hypothesis was that the “Request discount coupon” button sounded like a commitment too early, on the first screen of the flow. A button like “Continue” and a more visible discount would encourage more people to start.',
               'Nuestra hipótesis era que el botón «Solicitar cupón de descuento» sonaba a compromiso demasiado pronto, en la primera pantalla del flujo. Un botón como «Continuar» y un descuento más visible animarían a más gente a empezar.']},
    {k:'p', t:['**The opportunity:** if more employees started the flow, more of them would get as far as buying.','**La oportunidad:** si más empleados empezaban el flujo, más llegarían a comprar.']},
    {k:'goal', q:1, label:['The question the experiment had to answer.','La pregunta que debía responder el experimento.'], t:['Would a lower-commitment button and a more visible discount get more employees to start the purchase, and to buy?','¿Un botón con menos compromiso y un descuento más visible conseguirían que más empleados empezaran la compra y compraran más?']},
    {k:'h', t:['Same layout, less commitment','La misma estructura, menos compromiso']},
    {k:'p', t:['I rebuilt the detail screen with the new design system, keeping the same structure so as not to change more than needed. I made the discount percentage more prominent and changed the button copy.',
               'Rehíce la pantalla de detalle con el nuevo design system manteniendo la misma estructura, para no cambiar más de lo necesario. Di más protagonismo al porcentaje de descuento y cambié el texto del botón.']},
    {k:'ba', n:2, items:[['assets/discount-t1-before.webp',['Before · “Request coupon”','Antes · «Solicitar cupón»']],['assets/discount-t1-after.webp',['After · “Continue”','Después · «Continuar»']]],
      cap:['Experiment 1: a lower-commitment button and a more visible discount on the coupon detail.','Experimento 1: un botón con menos compromiso y un descuento más visible en el detalle del cupón.']},
    {k:'split', meta:['11–29 April 2024 · A/B experiment, 50/50 · App users, excluding Cobee employees','11–29 de abril de 2024 · Experimento A/B 50/50 · Usuarios de la app, sin empleados de Cobee'],
      h:['More entries, same purchases','Más entradas, mismas compras'],
      intro:['We measured how many people moved from the detail to choosing an amount and, as a secondary metric, purchases.','Medimos cuánta gente pasaba del detalle a elegir el importe y, como métrica secundaria, las compras.'],
      items:[[['Moving to the amount','Paso al importe'],['+7.54%','+7,54 %'],['Statistically significant.','Estadísticamente significativo.'],'up'],
             [['Purchases','Compras'],['No change','Sin cambios'],['No significant difference.','Sin diferencia significativa.']]]},
    {k:'p', t:['A clearer entry brought more people into the flow, but didn’t turn them into buyers. I rolled out the new version anyway, as it was already part of the migration, and looked for the blocker further down.',
               'Una entrada más clara metía a más gente en el flujo, pero no la convertía en compradora. Lancé la nueva versión igualmente, porque ya formaba parte de la migración, y busqué el freno más abajo.']},

    {k:'chap', n:['3 · Experiment 2','3 · Experimento 2'], t:['Explain how it works, only to those who need it','Explicar cómo funciona, solo a quien lo necesita']},
    {k:'p', t:['The first experiment got more users to move forward, but not to buy more. The next hypothesis was that information was missing to understand the benefit and its conditions, such as how it works, expiry or refunds.',
               'El primer experimento consiguió que más usuarios avanzaran, pero no que compraran más. La siguiente hipótesis era que faltaba información para entender el beneficio y sus condiciones, como el funcionamiento, la caducidad o las devoluciones.']},
    {k:'p', t:['**The opportunity:** if they understood the benefit before starting, more would feel confident enough to buy.','**La oportunidad:** si entendían el beneficio antes de empezar, más se animarían a comprar.']},
    {k:'goal', q:1, label:['The question the experiment had to answer.','La pregunta que debía responder el experimento.'], t:['Would explaining how the benefit works, without cluttering it for those who already knew, increase purchases?','¿Explicar cómo funciona el beneficio, sin saturar a quien ya lo conocía, aumentaría las compras?']},
    {k:'p', t:['The most direct option was to add all that information to the discount view, but it cluttered the screen for those who already knew how it worked. Since most people only need to understand it once, I proposed a separate “Information” tab, one tap away, and kept “Discounts” as the main view.',
               'La opción más directa era añadir toda esa información a la vista del descuento, pero saturaba la pantalla para quien ya sabía cómo funcionaba. Como la mayoría solo necesita entenderlo una vez, propuse una pestaña aparte de «Información», a un toque, y mantuve «Descuentos» como vista principal.']},
    {k:'ba', n:2, items:[['assets/discount-t2-before.webp',['Before · coupons only','Antes · solo cupones']],[['assets/discount-t2-after-a.webp','assets/discount-t2-after-b.webp'],['After · Discounts and Information tabs','Después · pestañas Descuentos e Información'],{x:72,y:41}]],
      cap:['Experiment 2: how the benefit works, in its own tab for whoever needs it.','Experimento 2: cómo funciona el beneficio, en su propia pestaña para quien lo necesite.']},
    {k:'split', meta:['30 April – 21 May 2024 · A/B experiment, 50/50 · 22 days · Excluding Cobee employees','30 de abril – 21 de mayo de 2024 · Experimento A/B 50/50 · 22 días · Sin empleados de Cobee'],
      h:['Those who understood bought more','Quien entendía, compraba más'],
      intro:['We measured how many opened the new tab and whether understanding the benefit turned into purchases.','Medimos cuántos abrían la nueva pestaña y si entender el beneficio se traducía en compras.'],
      items:[[['Checked the info','Consultaron la info.'],['37.7%','37,7 %'],['of users with the new version.','de los usuarios con la nueva versión.']],
             [['Completed purchases','Compras completadas'],['+13.19%','+13,19 %'],['With a 90% confidence level.','Con un nivel de confianza del 90 %.'],'up'],
             [['Purchase starts','Inicio de compra'],['No change','Sin cambios'],['No significant difference.','Sin diferencia significativa.']]]},
    {k:'p', t:['The new version didn’t get more users to start the purchase, but it did get more of them to complete it. The result suggested that having the information could help clear up doubts before paying.',
               'La nueva versión no consiguió que más usuarios empezaran la compra, pero sí que más la completaran. El resultado apuntaba a que disponer de la información podía ayudar a resolver dudas antes de pagar.']},

    {k:'chap', n:['4 · Experiment 3','4 · Experimento 3'], t:['Clarity and trust where people dropped','Claridad y confianza donde se caía la gente']},
    {k:'p', t:['The previous experiments improved the entry and the information available, but doubts remained when choosing the amount and paying: should they enter the coupon’s value or what they’d pay with the discount? Was it safe to add their card? The amount screen, all grey and with a disabled button, didn’t help answer them, and at payment nothing reassured them when entering their details.',
               'Los experimentos anteriores mejoraron la entrada y la información disponible, pero persistían las dudas al elegir el importe y pagar: ¿debían introducir el valor del cupón o lo que pagarían con descuento? ¿Era seguro añadir su tarjeta? La pantalla del importe, toda en gris y con el botón desactivado, no ayudaba a resolverlas, y en el pago nada tranquilizaba al meter los datos.']},
    {k:'p', t:['Our hypothesis was that resolving those doubts within the flow would reduce drop-off and increase completed purchases.',
               'Nuestra hipótesis era que resolver esas dudas dentro del flujo reduciría el abandono y aumentaría las compras completadas.']},
    {k:'p', t:['**The opportunity:** the amount and payment steps concentrated much of the drop-off. If more people got through those two steps, more would complete the purchase.','**La oportunidad:** el importe y el pago concentraban buena parte del abandono. Si más personas superaban esos dos pasos, más llegarían a completar la compra.']},
    {k:'goal', q:1, label:['The question the experiment had to answer.','La pregunta que debía responder el experimento.'], t:['Would clear instructions at the amount step and a security message at payment get more people to complete the purchase?','¿Instrucciones claras en el importe y un mensaje de seguridad en el pago conseguirían que más gente completara la compra?']},
    {k:'goal', note:1, label:['What shaped the solution?','¿Qué condicionó la solución?'], t:['The mechanic was set by the partner and we couldn’t change it: the user entered how much they wanted to pay and received a voucher with extra balance. With a 20% bonus, they paid €100 and received €120 to spend at the brand. Working within it was the quick win, so the challenge was explaining that relationship: I focused the design on distinguishing how much you pay and how much you receive, showing both amounts before entering the card.',
               'La mecánica venía fijada por el partner y no podíamos modificarla: el usuario introducía cuánto quería pagar y recibía un voucher con saldo adicional. Con una bonificación del 20 %, pagaba 100 € y recibía 120 € para gastar en la marca. Trabajar dentro de ella era el quick win, así que el reto era explicar esa relación: centré el diseño en distinguir cuánto pagas y cuánto recibes, mostrando ambas cantidades antes de introducir la tarjeta.']},
    {k:'h', t:['What I changed','Lo que cambié']},
    {k:'p', t:['**Amount:** I made clear which amount to enter, showed the discount and the final price, and replaced the button that started out disabled.',
               '**Importe:** aclaré qué cantidad introducir, mostré el descuento y el precio final, y sustituí el botón inicialmente desactivado.']},
    {k:'p', t:['**Payment:** I kept the purchase summary visible and added instructions and a security message next to the card field.',
               '**Pago:** mantuve visible el resumen de compra y añadí instrucciones y un mensaje de seguridad junto al campo de la tarjeta.']},
    {k:'slide', items:[
      {before:'assets/discount-t3-amount-before.webp', after:'assets/discount-t3-amount-after.webp', h:['Amount','Importe'], alt_b:['Amount screen before','Pantalla de importe antes'], alt_a:['Amount screen after','Pantalla de importe después'],
       checks:[['Which amount to enter','Qué cantidad introducir'],['Discount and final price','Descuento y precio final'],['Button always active','Botón siempre activo']]},
      {before:'assets/discount-t3-pay-before.webp', after:'assets/discount-t3-pay-after.webp', h:['Payment','Pago'], alt_b:['Payment screen before','Pantalla de pago antes'], alt_a:['Payment screen after','Pantalla de pago después'],
       checks:[['Purchase summary visible','Resumen de compra visible'],['Instructions next to the card','Instrucciones junto a la tarjeta'],['Security message','Mensaje de seguridad']]}],
      cap:['Drag the line to compare before and after.','Arrastra la línea para comparar el antes y el después.']},
    {k:'split', meta:['22–29 July 2024 · A/B experiment, 50/50 · 7 days · App version 5.200 or later, excluding demo users','22–29 de julio de 2024 · Experimento A/B 50/50 · 7 días · App 5.200 o posterior, sin usuarios demo'],
      h:['Conversion went from 19.4% to 32.2%','La conversión pasó del 19,4 % al 32,2 %'],
      intro:['We measured completed purchases and how many people got through each of the two screens we changed.','Medimos las compras completadas y cuánta gente superaba cada una de las dos pantallas que cambiamos.'],
      items:[[['Completed purchases','Compras completadas'],['+12.8 pp','+12,8 pp'],['19.4% → 32.2%. Statistically significant.','19,4 % → 32,2 %. Estadísticamente significativo.'],'up'],
             [['Continuing after the amount','Continuar tras el importe'],['+18 pp','+18 pp'],['45.3% → 63.3%. The amount step stopped being the big drop.','45,3 % → 63,3 %. El importe dejó de ser la gran caída.'],'up'],
             [['Entering the card','Introducir tarjeta'],['+8.1 pp','+8,1 pp'],['34.0% → 42.1%. More people trusted the payment.','34,0 % → 42,1 %. Más gente confiaba en el pago.'],'up']]},
    {k:'p', t:['This experiment produced the biggest improvement of the three. Making the amount and payment steps easier had more impact than improving only the entry to the flow. Because we tested the changes together, we can’t attribute the improvement to a single element.',
               'Este experimento produjo la mayor mejora de los tres. Facilitar los pasos de importe y pago tuvo más impacto que mejorar únicamente la entrada al flujo. Como probamos los cambios juntos, no podemos atribuir la mejora a un elemento concreto.']},

    {k:'chap', n:['5 · What changed','5 · Lo que cambió'], t:['Leaving the flow better than we found it','Dejar el flujo mejor de lo que lo encontramos']},
    {k:'p', t:['All three new versions were rolled out to 100% of users. We completed the migration to the design system and measured what each intervention contributed: more people moving on from the detail, accessible information and less drop-off at amount and payment.',
               'Las tres nuevas versiones se desplegaron al 100 % de los usuarios. Completamos la migración al sistema de diseño y medimos qué aportaba cada intervención: más avances desde el detalle, información accesible y menos abandono en importe y pago.']},
    {k:'next', h:['What I would test next','Qué probaría después'], t:[['Evaluate which security messages help most at payment.','Evaluar qué mensajes de seguridad ayudan más en el pago.'],
                 ['Explore relevant offers for different user profiles.','Explorar ofertas relevantes para distintos perfiles de usuario.'],
                 ['Add a satisfaction measure to complement the conversion data.','Incorporar una medida de satisfacción para complementar los datos de conversión.']]},
    {k:'impact', from:[['Product','Producto'],['+12.8 pp','+12,8 pp'],['completed purchases in experiment\u00a03','compras completadas en el experimento\u00a03']],
      to:[['Business (estimate)','Negocio (estimación)'],['≈ +€98.8K','≈ +98.800 €'],['Conservative projection of purchase volume, not Cobee revenue.','Proyección conservadora del volumen de compras, no ingresos de Cobee.']], more:'impact'}
  ],
  ask:[
    {id:'impact', q:['What was the business impact?','¿Qué impacto tuvo en negocio?'], m:[[['19.4% → 32.2%','19,4% → 32,2%'],['completed purchases, experiment 3, significant','compras completadas, experimento 3, significativo']],[['+13.19%','+13,19%'],['purchases with the information tab, 90% confidence','compras con la pestaña de información, 90 % de confianza']],[['+7.54%','+7,54%'],['entries to the amount step with the new button','entradas al importe con el nuevo botón']],[['≈ +€98.8K','≈ +98.800 €'],['estimated extra GMV a year, conservative','GMV anual extra estimado, conservador']]],
      note:['Estimated figure. How it’s calculated: we applied the same relative uplift (+65.6%) to a yearly baseline of 5,520 people reaching the amount step, with a 27.3% purchase rate and a €100 average purchase. That takes purchases from 1,507 to 2,495 a year: +988 purchases and +€98,800 in GMV. It’s conservative, because traffic during the experiments was higher.',
            'Cifra estimada. Cómo se calcula: aplicamos la misma subida relativa (+65,6 %) a una base anual de 5.520 personas que llegaban al importe, con un 27,3 % de compra y una compra media de 100 €. Eso lleva las compras de 1.507 a 2.495 al año: +988 compras y +98.800 € de GMV. Es conservadora, porque durante los experimentos el tráfico fue mayor.']},
    {id:'role', q:['What was my role?','¿Cuál fue mi papel?'], list:[['I drove experimentation as part of the migration to the new design system.','Impulsé la experimentación como parte de la migración al nuevo sistema de diseño.'],['I analysed the journey and the sessions, defined the hypotheses and metrics, designed the variants and interpreted the results.','Analicé el recorrido y las sesiones, definí las hipótesis y métricas, diseñé las variantes e interpreté los resultados.'],['I worked with a developer, who was responsible for implementing and launching the tests.','Trabajé con un desarrollador, responsable de implementar y lanzar las pruebas.']]},
    {id:'discarded', q:['What did I rule out?','¿Qué descarté?'],
      after:{t:['After improving conversion, the team moved its focus to other priorities and we closed the initiative. These were left as possible next steps:','Tras mejorar la conversión, el equipo trasladó el foco a otras prioridades y cerramos la iniciativa. Quedaron como posibles siguientes pasos:'],
             list:[['Test security messages adapted to each user.','Probar mensajes de seguridad adaptados al usuario.'],['Explore personalised offers.','Explorar ofertas personalizadas.'],['Measure satisfaction with the flow.','Medir la satisfacción con el flujo.']],
             end:['We didn’t get to develop or validate those proposals.','No llegamos a desarrollar ni validar esas propuestas.']}},
    {id:'wrong', q:['What didn’t go as I expected?','¿Qué no salió como esperaba?'], t:['I expected that making the first step easier would also increase purchases. Moving on to the amount improved by 7.54%, but purchases showed no significant difference. That result led me to look at the later barriers instead of continuing to optimise the entry.','Esperaba que facilitar el primer paso aumentara también las compras. El avance al importe mejoró un 7,54 %, pero las compras no mostraron una diferencia significativa. Ese resultado me llevó a revisar las barreras posteriores, en lugar de seguir optimizando la entrada.']},
    {id:'learned', q:['What did I learn?','¿Qué aprendí?'], learn:[
      [['Moving forward isn’t buying','Avanzar no es comprar'],['The first experiment improved moving on to the amount, but not purchases. Measuring both results avoided mistaking an intermediate improvement for the final goal.','El primer experimento mejoró el paso al importe, pero no las compras. Medir ambos resultados evitó confundir una mejora intermedia con el objetivo final.']],
      [['Clarity matters at payment','La claridad importa en el pago'],['Clear instructions, a transparent price and reassurance at payment make the difference between dropping off and buying.','Instrucciones claras, precio transparente y seguridad en el pago marcan la diferencia entre abandonar y comprar.']],
      [['Testing in stages','Probar por etapas'],['Testing in stages helped guide every decision. With one developer, we kept the changes focused and used the results to define the next experiment.','Probar por etapas permitió orientar cada decisión. Con un desarrollador, acotamos los cambios y usamos los resultados para definir el siguiente experimento.']]]},
    {id:'different', q:['What would I do differently today?','¿Qué haría distinto hoy?'], learn:[

      [['Measure beyond the experiment','Medir más allá del experimento'],['I would also check whether the improvement held over time and whether it varied between new and returning buyers.','También comprobaría si la mejora se mantenía en el tiempo y si variaba entre compradores nuevos y recurrentes.']]]},
    {id:'inspired', q:['What inspired me?','¿En qué me inspiré?'], t:['I reviewed different shopping apps to compare how they organised the checkout, showed the price and explained the payment. I adapted those references to the partner’s mechanic, to clearly distinguish how much the user paid and how much they received in the voucher before entering their card.','Revisé distintas aplicaciones de compra para comparar cómo organizaban el checkout, mostraban el precio y explicaban el pago. Adapté esas referencias a la mecánica del partner, para distinguir con claridad cuánto pagaba el usuario y cuánto recibía en el voucher antes de introducir su tarjeta.']}

  hl:{label:['Why it matters','Por qué importa'],

  blocks:[
    {k:'h', t:['Context','Contexto']},
    {k:'p', t:['Cobee is a B2B2C platform that helps companies manage and distribute employee benefits. What began as a small experiment evolved into a scalable framework that changed how Cobee builds and expands its product.',
               'Cobee es una plataforma B2B2C que ayuda a las empresas a gestionar y distribuir beneficios para sus empleados. Lo que empezó como un pequeño experimento acabó siendo un marco escalable que cambió cómo Cobee construye y amplía su producto.']},
    {k:'h', t:['Discovery','Discovery']},
    {k:'p', t:['I led benchmarking, mystery shopping and an analysis of what companies were asking for. The concept of “benefit” was as diverse as the companies themselves: product discounts, branded gift boxes, event tickets, family bonuses, extra days off, mental health.',
               'Lideré el benchmarking, el mystery shopping y el análisis de lo que pedían las empresas. El concepto de “beneficio” era tan diverso como las propias empresas: descuentos en productos, cestas de regalo con su marca, entradas a eventos, ayudas familiares, días libres extra, salud mental.']},
    {k:'call', t:['The real need wasn’t more core benefits. It was flexibility and autonomy for admins. How could companies offer all their benefits, even the unique ones, without overloading the system or the UX?',
                  'La necesidad real no era tener más beneficios core, sino flexibilidad y autonomía para los admins. ¿Cómo podían las empresas ofrecer todos sus beneficios, incluso los únicos, sin sobrecargar el sistema ni la UX?']},
    {k:'h', t:['Validating demand before building','Validar la demanda antes de construir']},
    {k:'p', t:['We placed a “Create your own benefit” fake door in the admin dashboard to measure real intent.','Pusimos un fake door de “Crea tu propio beneficio” en el dashboard de admin para medir la intención real.']},
    {k:'abc', unit:'%', rows:[[['Admins who clicked','Admins que hicieron clic'],26],[['Completed the flow and joined the beta','Completaron el flujo y se unieron a la beta'],16]],
      cap:['A demand signal, not adoption. Sales confirmed it as a deal-closing differentiator, so we decided to build a low-tech MVP.','Una señal de demanda, no adopción. Ventas lo confirmó como diferencial para cerrar deals, así que decidimos construir un MVP low-tech.']},
    {k:'h', t:['The MVP: Plain Benefits','El MVP: Plain Benefits']},
    {k:'p', t:['One flexible, text-based template for any perk: image, title, description and an external link. An agent fills it in the backoffice, publishes it, and employees see it in the app instantly, with no development per benefit.',
               'Una única plantilla flexible de texto para cualquier beneficio: imagen, título, descripción y un enlace externo. Un agente la rellena en el backoffice, la publica y los empleados la ven en la app al momento, sin desarrollo por beneficio.']},
    {k:'list', t:[['Success criteria: traction in the sales pipeline and 15+ new custom benefits in three months.','Criterio de éxito: tracción en el pipeline de Ventas y más de 15 beneficios nuevos en tres meses.'],
                 ['For companies: autonomy to launch their own perks. For employees: everything in one place. For Cobee: faster go-to-market.','Para las empresas: autonomía para lanzar sus beneficios. Para los empleados: todo en un sitio. Para Cobee: salir antes al mercado.']]},
    {k:'img', src:'assets/benefits-howto.webp', max:760, cap:['How it works: one guided flow to create a benefit, available worldwide by default or only in the selected countries.','Cómo funciona: un único flujo guiado para crear un beneficio, disponible en todos los países por defecto o solo en los que se elijan.']},
    {k:'ba', n:2, items:[['assets/benefits-backoffice.webp',['Backoffice · one form','Backoffice · un formulario']],['assets/benefits-app.webp',['App · what employees see','App · lo que ve el empleado']]],
      cap:['One form feeds every surface: once published, the benefit appears in the employee app…','Un formulario alimenta todas las superficies: al publicarlo, el beneficio aparece en la app del empleado…']},
    {k:'img', src:'assets/benefits-admin.webp', cap:['…and in the admin dashboard, where HR manages and deactivates it.','…y en el dashboard de admin, donde RRHH lo gestiona y lo desactiva.']},
    {k:'h', t:['Scaling with reusable pieces','Escalar con piezas reutilizables']},
    {k:'steps', items:[
      [['Level 1 · Plain, 2023','Nivel 1 · Plain, 2023'],['Information and a link. Launched in Spain, then Mexico and Portugal.','Información y un enlace. Lanzado en España, luego México y Portugal.']],
      [['Level 2 · Card payment, 2024','Nivel 2 · Pago con tarjeta, 2024'],['The benefit is linked to the Cobee card, so employees pay directly at the provider, like the company canteen.','El beneficio se vincula a la tarjeta Cobee y el empleado paga directamente en el proveedor, como el comedor de la empresa.']],
      [['Level 3 · Reimbursement, 2024','Nivel 3 · Reembolso, 2024'],['Employees upload a receipt and the company reimburses it. Key for Portugal.','El empleado sube el ticket y la empresa se lo reembolsa. Clave para Portugal.']],
      [['Level 4 · Multi-payment, next','Nivel 4 · Multipago, siguiente'],['Combining payment methods under one benefit.','Combinar métodos de pago en un mismo beneficio.']]
    ]},
    {k:'p', t:['Each piece reused the same creation flow and templates, so it became available to every benefit instead of being rebuilt one by one.','Cada pieza reutilizaba el mismo flujo y las mismas plantillas, así quedaba disponible para todos los beneficios en lugar de construirse uno a uno.']},
    {k:'h', t:['Results two years later','Resultados dos años después']},
    {k:'table', head:[['Year','Año'],'Plain',['Card','Tarjeta'],['Reimbursement','Reembolso'],['Note','Nota']], rows:[

                 ['Payments were only 7% of unique benefits. The main value was flexibility and having everything in one place.','Los pagos eran solo el 7% de los beneficios únicos. El valor principal era la flexibilidad y tenerlo todo en un sitio.']]},
    {k:'learn', items:[
      [['Starting simple was the smartest move','Empezar simple fue la mejor decisión'],['Plain Benefits proved that centralising and communicating perks met most needs. Modular templates then let Cobee scale without technical debt.','Plain Benefits demostró que centralizar y comunicar los beneficios cubría casi todo. Las plantillas modulares permitieron escalar sin deuda técnica.']],
      [['A system that tests markets','Un sistema que valida mercados'],['In Mexico we used it to launch Meeting Pros, a medical service, to validate demand before investing in complex insurance. It became our fastest, lowest-risk way to test.','En México lo usamos para lanzar Meeting Pros, un servicio médico, y validar demanda antes de invertir en seguros complejos. Se convirtió en nuestra forma más rápida y de menor riesgo de testear.']]

  tags:['complex','b2c'],
  short:['Health Insurance renewals','Renovaciones del Seguro de Salud'],
  title:['Renewals designed as a system, built to survive peak season','Renovaciones diseñadas como un sistema, preparadas para la temporada alta'],
  card:['16 scenario–outcome combinations turned into one predictable experience: 89% positive feedback and half the incidents.','16 combinaciones de escenario y resultado convertidas en una experiencia predecible: 89% de feedback positivo y la mitad de incidencias.'],
  hl:{label:['What changed','Qué cambió'],
      text:['89% of 702 people said renewing felt simple, asked in-app right after they renewed. Incidents halved and there were zero critical blockers in the biggest revenue window of the year.','El 89% de 702 personas dijo que renovar fue sencillo, preguntado in-app justo después de renovar. Las incidencias bajaron a la mitad y no hubo ningún blocker crítico en la ventana de ingresos más importante del año.']},
  challenge:['Health insurance grew from about 30,000 to 63,000 active employees in a year, and around 90% of them would renew or switch plans between December and January. Once shipped, the flow couldn’t be iterated until the next year.',
             'El seguro de salud pasó de unos 30.000 a 63.000 empleados activos en un año, y cerca del 90% iba a renovar o cambiar de plan entre diciembre y enero. Una vez lanzado, el flujo no se podía iterar hasta el año siguiente.'],
  lede:['I redesigned Health Insurance renewals to handle the different situations of employees and their family members with a clear, consistent experience. The system had to absorb the benefit’s growth and work during a yearly campaign with little room to correct.',
        'Rediseñé la renovación del Seguro de Salud para resolver las distintas situaciones del empleado y sus familiares con una experiencia clara y consistente. El sistema debía absorber el crecimiento del beneficio y funcionar durante una campaña anual con poco margen para corregir.'],
  facts:[[['My role','Mi rol'],['Senior Product Designer\nHealth Insurance','Senior Product Designer\nSeguro de Salud']],[['Period','Periodo'],['December 2024 – January 2026\nLaunched in November 2025','Diciembre de 2024 – enero de 2026\nLanzamiento en noviembre de 2025']],[['Scope','Alcance'],['App, admin dashboard and backoffice\nRenewals and replacements','App, dashboard de admin y backoffice\nRenovaciones y reemplazos']]],
  story:1,

       {k:['My contribution','Mi aportación'], t:['I turned 16 scenario–outcome combinations into one predictable structure, validated with Operations, Engineering and users.','Convertí 16 combinaciones de escenario y resultado en una sola estructura predecible, validada con Operaciones, Ingeniería y usuarios.']},
       {k:['Impact','Impacto'], tone:'good', big:['−50%','−50%'], bigl:['Half the incidents','La mitad de incidencias'], t:['CX and operations incidents vs. the 2024 renewals','Incidencias de CX y operaciones frente a las renovaciones de 2024'], pp:['89% positive feedback','89 % de feedback positivo']}],

  blocks:[
    {k:'chap', n:['1 · The context','1 · El contexto'], t:['A critical moment that only happens once a year','Un momento crítico que solo ocurre una vez al año']},
    {k:'p', t:['After launching Health Insurance in Spain, Portugal and Mexico, the next challenge was ensuring its continuity: letting employees and their family members renew or change plans without interruptions or unnecessary manual work.',
               'Tras el lanzamiento del Seguro de Salud en España, Portugal y México, el siguiente reto era asegurar su continuidad: que empleados y familiares pudieran renovar o cambiar de plan sin interrupciones ni gestiones manuales innecesarias.']},
    {k:'p', t:['The benefit grew from about 30,000 active employees in December 2024 to 63,000 in November 2025. Around 90% would go through a renewal or a replacement, mostly concentrated between December and January.',
               'El beneficio pasó de unos 30.000 empleados activos en diciembre de 2024 a 63.000 en noviembre de 2025. Cerca del 90 % debía pasar por una renovación o un reemplazo, concentrados principalmente entre diciembre y enero.']},
    {k:'season', label:['When renewals happen','Cuándo ocurren las renovaciones'],

      hotl:['Peak season: ~90% of ~63,000 employees renew or switch plans','Temporada alta: ~90 % de ~63.000 empleados renueva o cambia de plan'], launchl:['Launch, November 2025','Lanzamiento, noviembre de 2025'],
      cap:['Once shipped, the experience couldn’t be iterated until the following year.','Una vez lanzada, la experiencia no se podía iterar hasta el año siguiente.']},

                  'En 2024, resolver problemas de renovación había consumido el 28 % de la capacidad del equipo, con más de 20 tickets en dos meses. La solución existente generaba incidencias y trabajo manual, y no estaba preparada para asumir ese crecimiento.']},

    {k:'goal', main:1, label:['Main goal','Objetivo principal'], t:['Let employees and their family members renew their coverage clearly and reliably, reducing incidents and manual intervention during the campaign.','Permitir que empleados y familiares renovaran su cobertura de forma clara y fiable, reduciendo las incidencias y la intervención manual durante la campaña.']},

    {k:'p', t:['We proposed a common renewal and replacement model that would reduce incidents, make operational work easier and adapt to future insurance benefits.',

                  ['Perceived ease of use when completing the process.','Percepción de facilidad de uso al completar el proceso.']]},

    {k:'p', t:['I mapped two dimensions: who the change affected and what would happen to their coverage in the next period.',
               'Mapeé dos dimensiones: a quién afectaba el cambio y qué ocurriría con su cobertura en el siguiente periodo.']},
    {k:'p', t:['The first distinguished the situations of the employee and their family members. The second covered four outcomes: automatic renewal, contracting a new plan, replacement, or no coverage available.',
               'La primera distinguía las situaciones del empleado y sus familiares. La segunda recogía cuatro resultados: renovación automática, contratación de un nuevo plan, reemplazo o ausencia de cobertura disponible.']},
    {k:'goal', note:1, label:['The rule behind every case','La regla que explica todos los casos'], t:['The family member’s coverage depends on the employee’s. If the employee has to renew manually or replace their insurance, they first have to confirm their own coverage and then their family members’. The family member’s card turns yellow to show it needs a new confirmation.',

           manr_auto:['it’s no longer automatic because the employee has a pending manual renewal. They first have to confirm their own coverage for the next period and then contract the family member’s.','deja de ser automática porque el empleado tiene pendiente su renovación manual. Primero debe confirmar su propia cobertura para el siguiente periodo y, después, contratar la del familiar.'],
           manr_repl:['it can’t go ahead until the employee completes their manual renewal and confirms their coverage for the next period. Then they can contract the family member’s: the employee has to be insured first.','no puede realizarse hasta que el empleado complete su renovación manual y confirme su cobertura para el siguiente periodo. Después podrá contratar la del familiar: el empleado debe estar asegurado primero.'],
           manr_man:['it already needed a manual renewal, and the employee also has theirs pending. They first have to confirm their own coverage for the next period and then contract the family member’s.','ya requería una renovación manual y el empleado también tiene pendiente la suya. Primero debe confirmar su propia cobertura para el siguiente periodo y, después, contratar la del familiar.'],
           reset_auto:['although it had automatic renewal, the employee’s change cancels that renewal. After the employee’s plan change, the family member’s coverage has to be contracted again.','aunque tenía renovación automática, el cambio del empleado deja sin efecto esa renovación. Tras el cambio de modalidad del empleado, debe volver a contratar la cobertura del familiar.'],
           reset_repl:['although a replacement had been chosen, the employee’s change cancels it. After the employee’s plan change, the family member’s coverage has to be contracted again.','aunque se había elegido un reemplazo, el cambio del empleado lo deja sin efecto. Tras el cambio de modalidad del empleado, debe volver a contratar la cobertura del familiar.'],
           reset_man:['it already had to be renewed manually, and it depends on the employee: after the employee’s plan change, the family member’s coverage has to be contracted again.','ya tenía que renovarse de forma manual y, además, depende del empleado: tras el cambio de modalidad del empleado, debe volver a contratar la cobertura del familiar.'],
           none:['the company no longer offers Health Insurance, so there’s no plan to renew. The insurance stays visible with the notice until it ends.','la empresa ya no ofrece el Seguro de Salud, así que no hay modalidad que renovar. El seguro sigue visible con el aviso hasta que termina.'],

    {k:'h', t:['Making every outcome understandable','Hacer comprensible cada resultado']},
    {k:'p', t:['I designed the cases on a common structure to communicate what was going to happen, who it affected and what the user had to do. That way, each person could understand their situation without knowing the system’s internal rules.',
               'Diseñé los casos sobre una estructura común para comunicar qué iba a pasar, a quién afectaba y qué debía hacer el usuario. Así, cada persona podía entender su situación sin conocer las reglas internas del sistema.']},
    {k:'p', t:['I also covered errors, pending data and the communications needed. I organised the flows by subject to review their coverage and make implementation easier.',
               'También contemplé errores, datos pendientes y las comunicaciones necesarias. Organicé los flujos por tema para revisar su cobertura y facilitar la implementación.']},
    {k:'views', label:['Two ways to see the process','Dos formas de ver el proceso'], items:[
      {l:['Prototype','Prototipo'], vid:'assets/renewals-prototype.mp4', poster:'assets/renewals-prototype-poster.webp', cap:['Prototype of the renewal flow in the app.','Prototipo del flujo de renovación en la app.']},
      {l:['Flow design','Diseño de flujos'], img:'assets/renewals-map.webp', cap:['Every flow organised by subject and the cases it includes.','Todos los flujos organizados por tema y los casos que incluye cada uno.']}]},
    {k:'h', t:['Validating from three perspectives','Validar desde tres perspectivas']},
    {k:'steps', items:[
      [['Operations','Operaciones'],['We checked the scenarios against the cases they handled in practice.','Contrastamos los escenarios con los casos que gestionaban en la práctica.']],
      [['Engineering','Ingeniería'],['We reviewed technical feasibility and scope from the start.','Revisamos la viabilidad técnica y el alcance desde el inicio.']],
      [['Users','Usuarios'],['We checked whether they understood what would happen to their coverage and how to continue.','Comprobamos si entendían qué ocurriría con su cobertura y cómo continuar.']]
    ]},

    {k:'chap', n:['4 · The result','4 · El resultado'], t:['Checking that it worked for users and teams','Comprobar que funcionaba para usuarios y equipos']},
    {k:'p', t:['We combined incident tracking with an in-app question right after renewing: “Did the experience feel simple?”',
               'Combinamos el seguimiento de incidencias con una pregunta en la app justo después de renovar: «¿Te ha parecido sencilla la experiencia?»']},
    {k:'p', t:['We analysed the answers by company and type of process to see where to dig deeper. In parallel, Product and Operations logged incidents and compared them with the previous campaign.',
               'Analizamos las respuestas por empresa y tipo de proceso para identificar dónde profundizar. En paralelo, Producto y Operaciones registraron las incidencias y las compararon con la campaña anterior.']},
    {k:'img', src:'assets/renewals-feedback.webp', cap:['The in-app question right after renewing, and the thank-you state.','La pregunta in-app justo después de renovar y el estado de agradecimiento.']},
    {k:'split', meta:['Gradual rollout: 144 companies in December 2025, 682 by 1 January 2026 · In-app question right after renewing · 702 answers','Lanzamiento progresivo: 144 empresas en diciembre de 2025 y 682 a 1 de enero de 2026 · Pregunta in-app justo después de renovar · 702 respuestas'],
      h:['The campaign in figures','La campaña en cifras'],
      items:[[['Positive answers','Respuestas positivas'],['89%','89 %'],['626 of 702 answers.','626 de 702 respuestas.'],'up'],
             [['Fewer incidents','Menos incidencias'],['50%','50 %'],['CX and Operations incidents, compared with the previous experience.','De CX y Operaciones frente a la experiencia anterior.'],'up'],
             [['Companies renewed','Empresas renovadas'],['682','682'],['Up to January 2026, with no critical blockers during the campaign.','Hasta enero de 2026, sin bloqueos críticos durante la campaña.']]]},
    {k:'bars', label:['Positive feedback by type','Feedback positivo por tipo'], rows:[[['Renewal (544)','Renovación (544)'],91.9],[['Replacement (158)','Reemplazo (158)'],79.7]],
      cap:['Answers in brackets. Replacements, where the plan changes, got less positive feedback than renewals. This difference showed where to investigate the remaining difficulties.','Entre paréntesis, las respuestas. Los reemplazos, en los que cambia el plan, tuvieron menos feedback positivo que las renovaciones. Esta diferencia señaló dónde investigar las dificultades restantes.']},
    {k:'quote', av:'Op', fb:['Internal feedback','Feedback interno'], t:['The new renewal experience is widely perceived as clearer, more intuitive and better structured. The improvements have significantly reduced operational friction during renewals.','La nueva experiencia de renovación se percibe como más clara, intuitiva y mejor estructurada. Las mejoras han reducido mucho la fricción operativa durante las renovaciones.'], by:['Operations team','Equipo de Operaciones']},
    {k:'p', t:['Operations highlighted fewer user errors, clearer flows and better visibility throughout the process.','Operaciones destacó menos errores de los usuarios, flujos más claros y más visibilidad durante todo el proceso.']},

    {k:'chap', n:['5 · What changed','5 · Lo que cambió'], t:['A foundation for future renewals','Una base para las siguientes renovaciones']},
    {k:'p', t:['The new experience let us face the campaign with fewer incidents and a common structure to handle complex situations.',
               'La nueva experiencia permitió afrontar la campaña con menos incidencias y una estructura común para gestionar situaciones complejas.']},
    {k:'p', t:['The model was ready to adapt to other insurance benefits, such as Life and Pension Insurance. Tracking by company and scenario also helped us identify specific problems to guide the next improvements.',
               'El modelo quedó preparado para adaptarse a otros seguros, como Vida y Pensiones. Además, el seguimiento por empresa y escenario nos permitió identificar problemas concretos para orientar las siguientes mejoras.']}
  ],
  ask:[
    {id:'impact', q:['What was the business impact?','¿Qué impacto tuvo en negocio?'], m:[[['682 / ~1,000','682 / ~1.000'],['companies in Spain renewed with the new experience by 1 January 2026 (144 in December)','empresas en España renovadas con la nueva experiencia a 1 de enero de 2026 (144 en diciembre)']],[['−50%','−50%'],['CX and operations incidents vs. the previous renewals','incidencias de CX y operaciones frente a las renovaciones anteriores']],[['89%','89%'],['positive feedback, 626 of 702 answers','feedback positivo, 626 de 702 respuestas']],[['0','0'],['critical blockers in the peak revenue window','blockers críticos en la ventana de ingresos']]]},
    {id:'role', q:['What was my role?','¿Cuál fue mi papel?'], list:[['I mapped the member scenarios and renewal outcomes and designed every combination case by case.','Mapeé los escenarios de miembros y los resultados de renovación, y diseñé cada combinación caso a caso.'],['I reviewed the solution with Operations, aligned scope with Engineering and tested it with users.','Revisé la solución con Operaciones, acoté el alcance con Ingeniería y la testé con usuarios.'],['I defined how to measure success: the in-app question per company and incident tracking with Operations.','Definí cómo medir el éxito: la pregunta in-app por empresa y el seguimiento de incidencias con Operaciones.']]},
    {id:'discarded', q:['What did I rule out?','¿Qué descarté?'], draft:1},
    {id:'wrong', q:['What didn’t go as I expected?','¿Qué no salió como esperaba?'], draft:1},
    {id:'learned', q:['What did I learn?','¿Qué aprendí?'], learn:[
      [['Seasonality forces better decisions','La estacionalidad obliga a decidir mejor'],['With a single high-risk window a year, priorities got sharper and solutions simpler. When you can’t iterate, clarity and robustness matter more than feature depth.','Con una única ventana de alto riesgo al año, las prioridades se afinaron y las soluciones se simplificaron. Cuando no puedes iterar, la claridad y la robustez importan más que la cantidad de funcionalidades.']],
      [['Measuring unlocks long-term value','Medir desbloquea valor a largo plazo'],['Clear success metrics showed what worked and what to improve next. Company-level feedback let us reach the exact companies and users with problems and understand the cause.','Unas métricas de éxito claras mostraron qué funcionaba y qué mejorar después. El feedback por empresa nos permitió llegar a las empresas y usuarios con problemas y entender la causa.']]]},
    {id:'different', q:['What would I do differently today?','¿Qué haría distinto hoy?'], draft:1},
    {id:'inspired', q:['What inspired me?','¿En qué me inspiré?'], draft:1}

{
  id:'taxdown', company:'TaxDown', year:'2026', tone:'--sky', img:'assets/taxdown-cover.webp', cover:{v:'21.5%', t:['purchase conversion, from 14.5%','conversión a compra, desde 14,5%']}, base:.4, recruiter:1,
  w:{experimentation:3, b2b:2},
  tags:['abtest','b2b'],
  short:['B2B conversion','Conversión B2B'],
  title:['Same discount, better timing: converting partner users','Mismo descuento, mejor momento: convertir a usuarios de partners'],
  card:['Two chained experiments in tax season. A reminder at the right moment took purchases from 14.5% to 21.5%.','Dos experimentos encadenados en plena campaña. Un recordatorio en el momento justo llevó las compras del 14,5% al 21,5%.'],
  hl:{label:['The finding','El hallazgo'],
      text:['Only about 55% of those who saw the onboarding remembered their discount well by the time they saw their tax result. Reminding them right then, with TaxDown’s own brand, raised purchases from 14.5% to 21.5%.','Solo cerca del 55% de quienes vieron el onboarding recordaba bien su descuento al ver el resultado de su renta. Recordárselo justo ahí, con la marca de TaxDown, subió las compras del 14,5% al 21,5%.']},
  challenge:['People arriving from partners, mostly banks, connected their data with the Spanish tax agency 17 points less than organic users: 39.4% vs 56.4%. Partners were around 40% of company revenue.',
             'Los usuarios que llegaban desde partners, sobre todo bancos, conectaban sus datos con la AEAT 17 puntos menos que los orgánicos: 39,4% frente a 56,4%. Los partners suponían cerca del 40% de la facturación.'],
  lede:['A series of initiatives built on quick experiments to increase annual-plan purchases among partner users.','Una serie de iniciativas basadas en experimentos rápidos para aumentar la compra de planes anuales entre los usuarios de partners.'],
  facts:[[['My role','Mi rol'],['Senior Product Designer\nB2B growth','Senior Product Designer\nGrowth B2B']],[['Period','Periodo'],['June 2026\nTax season','Junio de 2026\nCampaña de la renta']],[['Scope','Alcance'],['Mobile app\nOnboarding, result and checkout','App móvil\nOnboarding, resultado y compra']]],
  story:1,
  sum:[{k:['The challenge','El reto'], tone:'bad', t:['A channel that brought in around 40% of revenue, but converted less than organic.','Un canal que aportaba cerca del 40% de los ingresos, pero convertía menos que el orgánico.']},
       {k:['My contribution','Mi aportación'], t:['Two experiments and a survey to identify where to intervene and what to test next.','Dos experimentos y una encuesta para identificar dónde intervenir y qué probar después.']},
       {k:['Impact','Impacto'], tone:'good', big:['14.5% → 21.5%','14,5% → 21,5%'], bigl:['From 14.5% to 21.5%','Del 14,5% al 21,5%'], t:['Purchase conversion after seeing the result','Conversión a compra tras ver el resultado'], pp:'+7 pp'}],
  nums:[{k:['Business','Negocio'],v:'+48%',t:['more purchases in the experiment, in the channel behind ~40% of revenue','más compras en el experimento, en el canal que aporta ~40% de la facturación']},
        {k:['User','Usuario'],v:'~55%',t:['of those who saw the onboarding remembered their discount well','de quienes vieron el onboarding recordaba bien su descuento']},
        {k:['Experiment','Experimento'],v:'A/B/C',t:['~5,000 users from 3 top partners, significant','~5.000 usuarios de 3 partners top, significativo']}],
  chain:[[['What was at stake','Lo que estaba en juego'],['40% of revenue','40% de la facturación'],['It came through partners, but those users connected their data 17 points less and rarely bought.','Llegaba por partners, pero esos usuarios conectaban sus datos 17 puntos menos y compraban poco.']],
         [['My bet','Mi apuesta'],['The problem was when, not what','El problema era el cuándo, no el qué'],['Remind users of their discount right after their result, with our brand instead of the bank’s.','Recordar el descuento justo tras el resultado, con nuestra marca y no la del banco.']],
         [['Impact','Impacto'],['14.5% → 21.5%','14,5% → 21,5%'],['Purchases after seeing the result, with one modal and the same discount.','Compras tras ver el resultado, con una modal y el mismo descuento.']]],
  blocks:[
    {k:'chap', n:['1 · The context','1 · El contexto'], t:['A key channel for the business, with room to convert better','Un canal clave para el negocio, con margen para convertir mejor']},
    {k:'p', t:['Banks and companies offered TaxDown with an exclusive discount to their customers or employees. This channel brought in around 40% of revenue, but its users bought less than those who arrived organically.',
               'Bancos y empresas ofrecían TaxDown con un descuento exclusivo a sus clientes o empleados. Este canal aportaba cerca del 40 % de la facturación, pero sus usuarios compraban menos que quienes llegaban de forma orgánica.']},
    {k:'p', t:['The gap already showed when connecting their tax data with the AEAT, the Spanish tax agency: only 39.4% of partner users did it, compared with 56.4% of organic ones. Without that connection, they couldn’t get as far as seeing their tax result and buying a plan.',
               'La diferencia ya aparecía al conectar los datos fiscales con la AEAT, la Agencia Tributaria española: solo lo hacía el 39,4 % de los usuarios de partners, frente al 56,4 % de los orgánicos. Sin esa conexión, no podían avanzar hasta conocer el resultado de su declaración y comprar un plan.']},
    {k:'goal', main:1, label:['Main goal','Objetivo principal'], t:['Increase the share of users coming from partners who bought a plan.','Aumentar el porcentaje de usuarios procedentes de partners que compraban un plan.']},
    {k:'journey', mode:'base', label:['The partner user’s journey','El journey del usuario de partner'], steps:TD_STEPS,
      flow:{src:'assets/taxdown-flow-', steps:[['BBVA landing','Landing BBVA'],['Sign up','Registro'],['Authorisation','Apoderamiento'],['Home','Inicio'],['Data','Datos'],['Result','Resultado'],['Plan','Plan']],
            cap:['The real flow for a BBVA customer, from the landing to choosing a plan. Screens of the Spanish app.','El flujo real para un cliente de BBVA, de la landing a elegir el plan.']},
      fr:{at:2, tag:['First big drop: partner vs organic','Primera gran caída: partner vs. orgánico'], h:['How many accept connecting their data?','¿Cuántos aceptan conectar sus datos?'], stats:[[['Organic','Orgánicos'],'56.4%'],[['Partners','Partners'],'39.4%']]},
      cap:['Why this step matters so much: after signing up, a window asked for the authorisation (the permission TaxDown needed to access the user’s tax data and act on their behalf with the AEAT, the Spanish tax agency). If users didn’t accept, we couldn’t prepare or review their draft, so it blocked the way to buying the plan.','Por qué este paso es tan importante: tras el registro, una ventana solicitaba el apoderamiento (una autorización necesaria para que TaxDown pudiera acceder a los datos fiscales y actuar en nombre del usuario ante la AEAT, la Agencia Tributaria española). Si el usuario no aceptaba, no podíamos preparar ni revisar el borrador y, por lo tanto, suponía un bloqueo para llegar hasta la compra del plan.']},

    {k:'chap', n:['2 · First bet','2 · Primera apuesta'], t:['Understanding the product before trusting it with their data','Entender el producto antes de confiarle sus datos']},
    {k:'p', t:['Our hypothesis was that partner users arrived drawn by the discount, but without really knowing TaxDown. Giving them context before asking for access to their tax data could increase connection and, after that, purchases.',
               'Nuestra hipótesis era que los usuarios de partners llegaban atraídos por el descuento, pero sin conocer bien TaxDown. Darles contexto antes de pedir acceso a sus datos fiscales podría aumentar la conexión y, después, las compras.']},
    {k:'journey', mode:'t1', label:['Friction point where we placed experiment 1','Punto de fricción donde ubicamos el experimento 1'], steps:TD_STEPS,
      t1:{h:['“Who is TaxDown and why do they want my data?”','«¿Quién es TaxDown y por qué me piden mis datos?»']}},
    {k:'p', t:['**The opportunity:** if more users understood TaxDown’s value and authorised access to their data, more of them would get to see their tax result. We expected that to turn into more plan purchases.',
               '**La oportunidad:** si más usuarios entendían el valor de TaxDown y autorizaban el acceso a sus datos, más llegarían a conocer el resultado de su declaración. Esperábamos que eso se tradujera en más compras del plan.']},
    {k:'goal', q:1, label:['The question the experiment had to answer.','La pregunta que debía responder el experimento.'], t:['Would explaining TaxDown’s value before asking for access to their tax data get more users to connect it and go on to buy a plan?','¿Explicar el valor de TaxDown antes de pedir acceso a los datos fiscales conseguiría que más usuarios los conectaran y avanzaran hasta comprar un plan?']},
    {k:'p', t:['At first, the team suggested expanding the landing, but an earlier experiment had already shown that the short version converted better. That’s why I proposed keeping it and stepping in after sign-up, right before asking for the authorisation.',
               'En un primer momento, el equipo planteó ampliar la landing, pero un experimento anterior ya había mostrado que la versión corta convertía mejor. Es por eso que propuse mantenerla e intervenir después del registro, justo antes de solicitar el apoderamiento.']},
    {k:'h', t:['Four steps to give context','Cuatro pasos para dar contexto']},
    {k:'p', t:['I designed a short introduction: who we are → how it works → your discount → connecting with the AEAT.',
               'Diseñé una introducción breve: quiénes somos → cómo funciona → tu descuento → conexión con la AEAT.']},
    {k:'img', src:'assets/taxdown-stepper.webp', cap:['The four-step onboarding, with the authorisation at the end.','El onboarding de cuatro pasos, con el apoderamiento al final.']},
    {k:'p', t:['My intention was to give information little by little, guiding users along the way. We already knew that putting all of it on the landing overwhelmed them and converted worse, and that the no-scroll version had worked better. So I moved those explanations to a more receptive moment: the onboarding at the start of the process, where users expect to be told how things work.',
               'Mi intención fue dar la información poco a poco, acompañando al usuario en su recorrido. Ya sabíamos que ponerla toda en la landing les abrumaba y convertía peor, y que la versión sin scroll había funcionado mejor. Así que llevé esas explicaciones a un momento más receptivo: el onboarding, al empezar el proceso, que es donde el usuario espera que le expliquen cómo funciona.']},
    {k:'p', t:['The authorisation came at the end, after explaining why we needed the data. I decided the flow couldn’t be skipped, since the authorisation was required to continue. That decision also brought a risk: adding steps could increase drop-off, so we measured onboarding completion.',
               'El apoderamiento quedaba al final, después de explicar para qué necesitábamos los datos. Decidí que el flujo no pudiera saltarse, ya que el apoderamiento era necesario para continuar. Esa decisión también introducía un riesgo: añadir pasos podía aumentar el abandono, así que medimos la finalización del onboarding.']},
    {k:'p', t:['Before launching it, we validated comprehension with users and reviewed the proposal with the internal teams responsible for approving the authorisation.',
               'Antes de lanzarlo, validamos la comprensión con usuarios y revisamos la propuesta con los equipos internos responsables de aprobar el apoderamiento.']},
    {k:'split', meta:['1–15 June 2026 · A/B experiment with an 80/20 split · New partner users on mobile','1–15 de junio de 2026 · Experimento A/B con reparto 80/20 · Nuevos usuarios de partners en móvil'],
      h:['More connections, no improvement in purchases','Más conexiones, sin mejora en compras'],
      intro:['We measured the onboarding for two weeks to see whether it got more users to connect their data and whether that improvement turned into purchases. We also tracked completion, to check how much drop-off the new steps introduced.','Medimos el onboarding durante dos semanas para ver si conseguía que más usuarios conectaran sus datos y si esa mejora se traducía en compras. También vigilamos su finalización para comprobar cuánto abandono introducían los nuevos pasos.'],
      items:[[['Connection with the AEAT','Conexión con la AEAT'],['+5.3 pp','+5,3 pp'],['Statistically significant improvement.','Mejora estadísticamente significativa.'],'up'],
             [['Onboarding completion','Finalización del onboarding'],'96%',['Among those who started it.','Entre quienes lo empezaron.']],
             [['Purchase conversion','Conversión a compra'],['No change','Sin cambios'],['They connected more, but didn’t buy more.','Conectaban más, pero no compraban más.']]]},
    {k:'p', t:['The onboarding made connecting easier, but it wasn’t enough to increase purchases. I kept it and decided to investigate what was still holding back the purchase decision.',
               'El onboarding facilitó la conexión, pero no bastó para aumentar las compras. Lo mantuve y decidí investigar qué seguía frenando la decisión de compra.']},
    {k:'chap', n:['3 · The turn','3 · El giro'], t:['Before changing the hypothesis, ask why','Antes de cambiar la hipótesis, preguntar por qué']},
    {k:'p', t:['We surveyed 96 users, split into four groups depending on whether they had seen the onboarding and whether they had completed or abandoned the flow. We wanted to understand how their experiences differed.',
               'Encuestamos a 96 usuarios, divididos en cuatro grupos según hubieran visto o no el onboarding y hubieran completado o abandonado el flujo. Queríamos entender qué diferencias había entre sus experiencias.']},
    {k:'p', t:['The most relevant finding was that only about 55% of those who had seen the onboarding remembered their discount well, including both those who completed the flow and those who abandoned it.',
               'El hallazgo más relevante fue que solo alrededor del 55 % de quienes habían visto el onboarding recordaba bien su descuento, incluyendo tanto a quienes completaron el flujo como a quienes lo abandonaron.']},
    {k:'dots', total:48, no:22, l_tot:['of 96 saw the onboarding','de 96 vieron el onboarding'], l_yes:['remembered the discount','recordaban el descuento'], l_no:['didn’t remember the discount','no recordaban el descuento'],
      sr:['Of the 96 survey responses, 48 came from users who saw the onboarding. Only about 55% of them, 26, remembered their discount well; 22 didn’t.','De las 96 respuestas de la encuesta, 48 eran de usuarios que vieron el onboarding. Solo cerca del 55% de ellos, 26, recordaba bien su descuento; 22 no.']},
    {k:'p', t:['The interviews helped us interpret the data: several days could pass between signing up and the purchase decision. Many remembered there was an offer, but weren’t clear on what their advantage was when they came back to the app.',
               'Las entrevistas ayudaron a interpretar el dato: podían pasar varios días entre el registro y la decisión de compra. Muchos recordaban que existía una oferta, pero no tenían claro cuál era su ventaja al volver a la aplicación.']},
    {k:'lead', t:['We reframed the hypothesis: the problem wasn’t what we told them, but when. Reminding them of the discount after showing their tax result could make it more relevant at the moment of deciding and increase purchases.','Reformulamos la hipótesis: el problema no era qué les contábamos, sino cuándo. Recordar el descuento después de mostrar el resultado de la declaración podría hacerlo más relevante en el momento de decidir y aumentar las compras.']},
    {k:'p', t:['**The survey pointed to a new opportunity:** bringing the discount back once users already knew their tax result and could weigh whether to buy a plan.',
               '**La encuesta apuntaba a una nueva oportunidad:** recuperar el descuento cuando el usuario ya conocía el resultado de su declaración y podía valorar si comprar un plan.']},

    {k:'chap', n:['4 · Second bet','4 · Segunda apuesta'], t:['Remind them at the moment they decide','Recordarlo en el momento de decidir']},
    {k:'p', t:['The discount already showed under the result and in checkout, but it had little visibility and many users didn’t reach the purchase. I designed a modal after the result that could be closed and took users to checkout with the discount applied. It was a contained intervention, quick to implement and to remove in the middle of the campaign.',
               'El descuento ya aparecía bajo el resultado y en el checkout, pero tenía poca visibilidad y muchos usuarios no llegaban a la compra. Diseñé una modal después del resultado, que podía cerrarse y llevaba al checkout con el descuento aplicado. Era una intervención acotada, rápida de implementar y retirar en plena campaña.']},
    {k:'journey', mode:'t2', label:['Where experiment 2 acts','Dónde actúa el experimento 2'], steps:TD_STEPS,
      t2a:{tag:['Hot · 2A','Hot · 2A'], h:['Modal right after the result','Modal justo tras el resultado'], q:['“Did I have a discount?”','«¿Tenía un descuento?»']},

      cap:['The friction was right before paying: many no longer remembered their discount well. 2A reminds them in the flow; 2B, for those who left, brings them back with an email.','La fricción estaba justo antes de pagar: muchos ya no recordaban bien su descuento. El 2A se lo recuerda en el flujo; el 2B, a quien se fue, le trae de vuelta con un email.']},
    {k:'p', t:['We tested two ways of reaching users over the same 12 days:','Probamos dos formas de llegar a los usuarios durante los mismos 12 días:']},
